<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel wydarzeń — Kino z Dianą</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root{--bg:#0a0a0a;--bg2:#141414;--bg3:#1c1c1c;--fg:#f4efe9;--muted:#a39d96;--accent:#ff8a6b;--accent2:#ffd9b0;--line:#2c2c2c;--ok:#7bd88f;--err:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Antonio,"Arial Narrow",sans-serif;text-transform:uppercase;color:var(--accent);line-height:1.05;font-weight:700}
h2{font-size:1.6rem;margin-bottom:.8rem}h3{font-size:1.15rem;margin:1.4rem 0 .6rem}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.94);border-bottom:1px solid var(--line);padding:.8rem 1.4rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1.5rem}header .sp{flex:1}
.pill{font-size:.85rem;color:var(--muted)}
.pill b{color:var(--accent2)}
button,.btn{font:600 .95rem Inter,sans-serif;border-radius:99px;padding:.6rem 1.2rem;cursor:pointer;border:2px solid var(--fg);background:none;color:var(--fg);transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#111}
button.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#111}
button:disabled{opacity:.4;cursor:default}
button.danger{border-color:var(--err);color:var(--err)}
button.danger:hover{background:var(--err);color:#111;border-color:var(--err)}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 62px)}
aside{border-right:1px solid var(--line);padding:1rem;background:var(--bg2);overflow:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
main{padding:1.4rem 2rem 6rem;max-width:1100px}
input,textarea,select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:.5rem;padding:.55rem .75rem;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:5.5rem;resize:vertical}
label{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.row{display:grid;gap:.8rem;margin-bottom:.8rem}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}
.item{display:flex;gap:.7rem;align-items:center;padding:.45rem;border-radius:.5rem;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--bg3)}.item.on{border-color:var(--accent);background:var(--bg3)}
.item img,.item .ph{width:44px;height:30px;object-fit:cover;border-radius:.25rem;background:var(--bg);flex:none}
.item b{display:block;font-size:.9rem;line-height:1.2}.item small{color:var(--muted)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.cand{background:var(--bg3);border:2px solid var(--line);border-radius:.6rem;padding:.5rem;cursor:pointer;text-align:center;font-size:.85rem}
.cand:hover{border-color:var(--accent2)}.cand.on{border-color:var(--accent)}
.cand img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:.4rem;background:var(--bg);margin-bottom:.4rem}
.cand b{display:block}.cand small{color:var(--muted)}.cand .m{color:var(--ok);font-size:.75rem}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.img{position:relative;border:3px solid transparent;border-radius:.5rem;overflow:hidden;cursor:pointer;background:var(--bg3)}
.img img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.img.on{border-color:var(--accent)}.img.on::after{content:"✓ wybrany";position:absolute;top:.4rem;left:.4rem;background:var(--accent);color:#111;font:700 .75rem Inter;padding:.15rem .5rem;border-radius:99px}
.img small{position:absolute;right:.4rem;bottom:.3rem;background:rgba(0,0,0,.7);padding:0 .4rem;border-radius:.3rem;font-size:.7rem}
.posters .img img{aspect-ratio:2/3}.posters{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.cur{display:flex;gap:1rem;align-items:center;margin-bottom:.8rem;padding:.6rem;border:1px dashed var(--line);border-radius:.5rem}
.cur img{height:80px;border-radius:.3rem}
.radio{display:flex;gap:1.2rem;flex-wrap:wrap;margin:.5rem 0}.radio label{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--fg);display:flex;gap:.4rem;align-items:center}
.radio input{width:auto}
.prev{margin-top:.5rem}.prev img{max-height:110px;border-radius:.4rem;border:1px solid var(--line)}
.urlrow{display:flex;gap:.6rem;align-items:center}.urlrow input{flex:1}
.note{color:var(--muted);font-size:.85rem}
.msg{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);padding:.8rem 1.4rem;border-radius:.6rem;background:var(--bg3);border:1px solid var(--line);max-width:90vw;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.6);white-space:pre-wrap}
.msg.ok{border-color:var(--ok)}.msg.err{border-color:var(--err)}
.bar{position:fixed;inset:auto 0 0 320px;background:rgba(10,10,10,.95);border-top:1px solid var(--line);padding:.8rem 2rem;display:flex;gap:1rem;align-items:center;z-index:15}
details{border:1px solid var(--line);border-radius:.6rem;padding:.6rem .9rem;margin-top:1rem}summary{cursor:pointer;color:var(--accent2)}
.fo-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1.4rem;align-items:start;margin-top:.6rem}
.fo-frame{position:relative;overflow:hidden;border-radius:.5rem;border:1px solid var(--line);background:#0a0a0a;cursor:grab;touch-action:none;user-select:none;container-type:inline-size}
.fo-frame:active{cursor:grabbing}
.fo-d{aspect-ratio:16/9}.fo-m{aspect-ratio:375/330;max-width:340px}
.fo-im{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fo-frame img{width:100%;height:100%;object-fit:cover;display:block}
.fo-d .fo-im{left:28%;-webkit-mask-image:linear-gradient(to right,transparent,#000 42%),linear-gradient(to top,transparent 2%,#000 30%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 42%),linear-gradient(to top,transparent 2%,#000 30%);mask-composite:intersect}
.fo-shade{position:absolute;inset:0;pointer-events:none}
.fo-m .fo-shade{background:linear-gradient(rgba(10,10,10,.9),rgba(10,10,10,.5) 30%,transparent 52%),linear-gradient(to top,rgba(0,0,0,.88),transparent 42%)}
.fo-t1,.fo-t2{position:absolute;font:700 1rem/.95 Antonio,"Arial Narrow",sans-serif;text-transform:uppercase;color:var(--accent);pointer-events:none}
.fo-t1 span{color:transparent;-webkit-text-stroke:.022em var(--accent)}
.fo-t2{text-align:right;text-wrap:balance}
.fo-d .fo-t1{left:4.4cqw;bottom:11.5cqw;font-size:6.6cqw}.fo-d .fo-t2{right:4.4cqw;bottom:5.5cqw;font-size:3.3cqw;max-width:36%}
.fo-m .fo-t1{left:5cqw;top:27cqw;font-size:12cqw}.fo-m .fo-t2{right:5cqw;bottom:11cqw;font-size:8.6cqw;max-width:85%}
.fo-sl{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;align-items:center;margin:.7rem 0 .5rem;font-size:.8rem;color:var(--muted)}
.fo-sl input{padding:0;accent-color:var(--accent)}
.fo button{font-size:.8rem;padding:.35rem .9rem;border-width:1px}
.fo-empty .fo-frame::after{content:"Najpierw wybierz zdjęcie powyżej";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.hide{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;max-height:300px}.bar{inset:auto 0 0 0}.c3,.c4{grid-template-columns:1fr 1fr}.fo-grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>Panel wydarzeń</h1><span class="pill" id="pending"></span><span class="sp"></span>
<button id="newBtn">+ Nowe wydarzenie</button><button id="pubBtn" class="primary">Opublikuj na stronie</button></header>
<div class="layout">
<aside><label>Szukaj w istniejących</label><input id="filter" placeholder="tytuł, reżyser, numer…" style="margin-bottom:.8rem"><div id="list"></div></aside>
<main id="main"><h2>Witaj</h2><p class="note">Wybierz wydarzenie z listy po lewej, żeby je poprawić, albo kliknij „+ Nowe wydarzenie”.</p></main>
</div>
<div class="bar hide" id="saveBar"><button class="primary" id="saveBtn">Zapisz</button><span class="note" id="saveNote">Zapis dzieje się na Twoim komputerze. Na stronie w internecie zmiana pojawi się po kliknięciu „Opublikuj na stronie”.</span><span class="sp" style="flex:1"></span><button class="danger hide" id="delBtn">Usuń wydarzenie</button></div>
<div class="msg hide" id="msg"></div>

<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = (p, w = "w300") => "https://image.tmdb.org/t/p/" + w + p;
const local = p => !p ? "" : /^https?:/.test(p) ? p : "/" + p;
let events = [], nextNumber = 1, cur = null, isNew = false, tm = {poster: null, backdrop: null}, tmdbData = null;
// źródło zdjęcia dla kadru (hero) i plakatu (poster): keep | tmdb | upload | url
const sel = {hero: {mode: "keep", upload: null, url: ""}, poster: {mode: "keep", upload: null, url: ""}};

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json", "X-Panel": "1"}, body: JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "Błąd " + r.status); return j;
}
function toast(text, kind = "ok", ms = 6000) { const m = $("#msg"); m.textContent = text; m.className = "msg " + kind; clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.add("hide"), ms); }
async function guard(fn, btn) { try { if (btn) btn.disabled = true; return await fn(); } catch (e) { toast(e.message, "err", 9000); } finally { if (btn) btn.disabled = false; } }

async function loadList() {
  const d = await api("/api/events"); events = d.events; nextNumber = d.nextNumber; drawList();
  const s = await api("/api/status"); $("#pending").innerHTML = s.changes ? `Niewysłane zmiany: <b>${s.changes}</b>` : "Wszystko opublikowane";
}
function drawList() {
  const q = $("#filter").value.toLowerCase();
  $("#list").innerHTML = events.filter(e => (e.title + " " + e.director + " " + e.number).toLowerCase().includes(q)).slice(0, 120).map(e =>
    `<div class="item${cur && !isNew && cur.id === e.id ? " on" : ""}" data-id="${esc(e.id)}">${e.image ? `<img src="${esc(local(e.image))}" alt="" loading="lazy">` : '<div class="ph"></div>'}<div><b>#${e.number} ${esc(e.title)}</b><small>${esc(e.date)}${e.time ? " · " + esc(e.time) : ""}</small></div></div>`).join("");
}
$("#filter").oninput = drawList;
$("#list").onclick = ev => { const it = ev.target.closest(".item"); if (it) guard(() => openEvent(it.dataset.id)); };
$("#newBtn").onclick = () => openNew();

function resetSel() { sel.hero = {mode: "keep", upload: null, url: ""}; sel.poster = {mode: "keep", upload: null, url: ""}; tm = {poster: null, backdrop: null}; tmdbData = null; }
function blank() { return {number: nextNumber, date: "", time: "", format: "Film + dyskusja", series: "", badge: "", note: "", description: "", ticketUrl: "", film: {}}; }
function openNew() { cur = blank(); isNew = true; resetSel(); render(); drawList(); }
async function openEvent(id) { cur = await api("/api/event?id=" + encodeURIComponent(id)); isNew = false; resetSel(); render(); drawList(); scrollTo(0, 0); }

const F = (k, label, v, ph = "") => `<div><label>${label}</label><input data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}"></div>`;

// Blok wyboru zdjęcia: kind = "hero" (kadr) albo "poster" (plakat)
function imageBlock(kind) {
  const e = cur, current = kind === "hero" ? (e.image || e.backdrop || e.poster) : e.poster, m = sel[kind].mode;
  const name = "m-" + kind, grid = kind === "hero" ? "bd" : "ps";
  const radio = (v, t) => `<label><input type="radio" name="${name}" value="${v}" ${m === v ? "checked" : ""}> ${t}</label>`;
  return `<div class="cur">${current ? `<img src="${esc(local(current))}" alt="">` : ""}<div><b>Obecne ${kind === "hero" ? "zdjęcie (kadr)" : "zdjęcie plakatu"}</b><div class="note">${esc(current || "brak")}</div></div></div>
  <div class="radio">${radio("keep", "Zostaw obecne")}${radio("tmdb", "Z TMDB (wybierz poniżej)")}${radio("upload", "Własny plik")}${radio("url", "Z linku (pobierze się samo)")}</div>
  <div id="${grid}" class="imgs ${kind === "poster" ? "posters" : ""}"></div>
  <div class="row c2" style="margin-top:.8rem">
    <div><label>Własny plik ${kind === "hero" ? "(najlepiej poziomy, min. 1600 px szerokości)" : "(pionowy plakat)"}</label><input type="file" id="file-${kind}" accept="image/*"><div class="prev" id="fprev-${kind}"></div></div>
    <div><label>Albo link do zdjęcia (adres https://…)</label><div class="urlrow"><input id="url-${kind}" value="${esc(sel[kind].url)}" placeholder="https://…/plik.jpg"></div><div class="prev" id="uprev-${kind}"></div><div class="note">Wklej adres samego obrazka (w przeglądarce: prawy przycisk na zdjęciu → „Kopiuj adres obrazu”). Pobierze się przy zapisie.</div></div>
  </div>`;
}
// Kadrowanie zdjęcia w sekcji głównej: cur.focus = {d: [x, y], m: [x, y]} (procenty; d = komputer, m = telefon)
const FO_DEF = [50, 30, 100];
function focusBlock() {
  const box = (k, name, reset) => `<div class="fo" data-fo="${k}"><label>${name}</label>
    <div class="fo-frame fo-${k}"><div class="fo-im"><img alt="" draggable="false"></div><div class="fo-shade"></div><div class="fo-t1">Kino z Dianą<br>Dąbrowską <span>#${esc(cur.number)}</span></div><div class="fo-t2"></div></div>
    <div class="fo-sl"><span>W poziomie</span><input type="range" min="0" max="100" data-ax="0"><span>W pionie</span><input type="range" min="0" max="100" data-ax="1"><span>Powiększenie</span><input type="range" min="100" max="250" data-ax="2"></div>
    <button type="button" class="fo-reset">${reset}</button></div>`;
  return `<h3 style="margin-top:1.4rem">Kadrowanie w sekcji głównej</h3>
  <p class="note">Przeciągnij zdjęcie w ramce albo użyj suwaków, osobno dla komputera i telefonu. Jeśli zdjęcie nie daje się przesunąć w którąś stronę, najpierw je powiększ. Napisy w ramkach pokazują, co na stronie zasłania zdjęcie. Ustawienie zapisuje się przyciskiem „Zapisz”.</p>
  <div class="fo-grid">${box("d", "Komputer (ekran 16:9)", "Przywróć domyślne")}${box("m", "Telefon", "Tak jak na komputerze")}</div>`;
}
function foGet(k) { const f = cur.focus || {}, v = (f[k] || (k === "m" && f.d) || FO_DEF).slice(); if (!(v[2] >= 100)) v[2] = 100; return v; }
function foSet(k, v) { cur.focus = cur.focus || {}; cur.focus[k] = v.map((x, i) => Math.max(i === 2 ? 100 : 0, Math.min(i === 2 ? 250 : 100, Math.round(x)))); foDraw(); }
function foSrc() {
  const s = sel.hero;
  if (s.mode === "upload" && s.upload) return s.upload.data;
  if (s.mode === "url" && /^https?:\/\//.test(s.url)) return s.url;
  if (s.mode === "tmdb" && tm.backdrop) return T(tm.backdrop, "w780");
  return local(cur.image || cur.backdrop || cur.poster);
}
function foDraw() {
  if (!cur) return;
  const src = foSrc();
  document.querySelectorAll(".fo").forEach(box => {
    const k = box.dataset.fo, v = foGet(k), im = box.querySelector("img");
    box.classList.toggle("fo-empty", !src);
    if (!src) im.removeAttribute("src"); else if (im.getAttribute("src") !== src) im.setAttribute("src", src);
    im.style.objectPosition = im.style.transformOrigin = v[0] + "% " + v[1] + "%";
    im.style.transform = "scale(" + v[2] / 100 + ")";
    box.querySelectorAll("input[type=range]").forEach(r => { r.value = v[+r.dataset.ax]; });
    box.querySelector(".fo-t2").textContent = (cur.film && cur.film.title) || "";
  });
}
function foWire() {
  document.querySelectorAll(".fo").forEach(box => {
    const k = box.dataset.fo, im = box.querySelector("img"), fr = box.querySelector(".fo-frame");
    box.querySelectorAll("input[type=range]").forEach(r => r.oninput = () => { const v = foGet(k); v[+r.dataset.ax] = +r.value; foSet(k, v); });
    box.querySelector(".fo-reset").onclick = () => { if (cur.focus) { delete cur.focus[k]; if (!Object.keys(cur.focus).length) delete cur.focus; } foDraw(); };
    let st = null;
    fr.onpointerdown = ev => { if (!im.naturalWidth) return; fr.setPointerCapture(ev.pointerId); st = {x: ev.clientX, y: ev.clientY, v: foGet(k)}; ev.preventDefault(); };
    fr.onpointermove = ev => {
      if (!st) return;
      const w = im.clientWidth, h = im.clientHeight, sc = Math.max(w / im.naturalWidth, h / im.naturalHeight) * st.v[2] / 100;
      const ox = im.naturalWidth * sc - w, oy = im.naturalHeight * sc - h;   // ile zdjęcia wystaje poza ramkę
      foSet(k, [ox > 1 ? st.v[0] - (ev.clientX - st.x) / ox * 100 : st.v[0], oy > 1 ? st.v[1] - (ev.clientY - st.y) / oy * 100 : st.v[1], st.v[2]]);
    };
    fr.onpointerup = fr.onpointercancel = () => { st = null; };
  });
  foDraw();
}
function render() {
  const e = cur, f = e.film || {};
  $("#saveBar").classList.remove("hide");
  $("#delBtn").classList.toggle("hide", isNew);
  $("#main").innerHTML = `
  <h2>${isNew ? "Nowe wydarzenie" : "#" + e.number + " " + esc(f.title)}</h2>
  <h3>1. Znajdź film w TMDB</h3>
  <div class="row c4"><div><label>Tytuł</label><input id="sq" value="${esc(f.title || "")}" placeholder="np. Słodkie życie"></div><div><label>Reżyser (opcjonalnie)</label><input id="sd" value="${esc(f.director || "")}"></div><div><label>Rok produkcji (opcjonalnie)</label><input id="sy" value="${esc(f.year || "")}"></div><div style="align-self:end"><button id="sgo" class="primary" style="width:100%">Szukaj</button></div></div>
  ${isNew ? "" : '<label class="note" style="text-transform:none;letter-spacing:0;display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem"><input type="checkbox" id="onlyImg" checked style="width:auto"> Tylko zdjęcia z TMDB (nie zmieniaj danych filmu, które już wpisałem)</label>'}
  <div id="cands" class="cands"></div>
  <p class="note" id="candNote">${isNew ? "Wpisz tytuł i kliknij Szukaj. Wybierz film, a uzupełnię dane i pokażę zdjęcia." : "Chcesz wybrać zdjęcie z TMDB? Kliknij Szukaj i wybierz film. Możesz też użyć własnego pliku albo linku poniżej."}</p>

  <h3>2. Kadr w sekcji głównej i na kafelkach</h3>${imageBlock("hero")}${focusBlock()}
  <h3 style="margin-top:1.4rem">3. Plakat (strona wydarzenia i katalog filmów)</h3>${imageBlock("poster")}

  <h3>4. Szczegóły wydarzenia</h3>
  <div class="row c4">${F("number", "Numer spotkania", e.number)}<div><label>Data</label><input type="date" data-k="date" value="${esc(e.date)}"></div>${F("time", "Godzina (np. 19:00)", e.time, "19:00")}${F("badge", "Plakietka (np. Przedpremiera)", e.badge)}</div>
  <div class="row c2">${F("ticketUrl", "Link do biletów", e.ticketUrl, "https://bilety.charlie.pl/…")}${F("note", "Goście / uwagi", e.note)}</div>
  <div class="row c2">${F("series", "Cykl (np. Cinema Italia Oggi)", e.series)}${F("format", "Format", e.format)}</div>
  <div class="row c2">${F("accent", "Kolor akcentu wydarzenia (puste = koralowy)", e.accent, "#ff8a6b")}${F("accent2", "Drugi kolor: pasek i kropka (puste = brzoskwiniowy)", e.accent2, "#ffd9b0")}</div>
  <label>Opis wydarzenia <span class="note" style="text-transform:none;letter-spacing:0">(pierwsze zdanie pokazuje się w żółtym pasku na stronie głównej)</span></label>
  <textarea data-k="description">${esc(e.description)}</textarea>
  <div style="margin:.4rem 0 1rem"><button id="useOv" ${tmdbData ? "" : "disabled"}>Wstaw opis filmu z TMDB</button></div>

  <details><summary>Dane filmu (uzupełniają się z TMDB, można poprawić)</summary><div style="margin-top:.8rem">
    <div class="row c3">${F("f.title", "Tytuł", f.title)}${F("f.director", "Reżyseria", f.director)}${F("f.year", "Rok", f.year)}</div>
    <div class="row c3">${F("f.original", "Tytuł oryginalny", f.original)}${F("f.country", "Kraj", f.country)}${F("f.runtime", "Czas trwania", f.runtime)}</div>
    <div class="row c3">${F("f.genre", "Gatunek", f.genre)}${F("f.screenplay", "Scenariusz", f.screenplay)}${F("f.cinematography", "Zdjęcia", f.cinematography)}</div>
    <div class="row c3">${F("f.music", "Muzyka", f.music)}${F("f.cast", "Obsada", f.cast)}${F("f.distributor", "Dystrybutor", f.distributor)}</div></div></details>`;
  drawImages(); wireImageInputs("hero"); wireImageInputs("poster"); foWire();
  $("#sgo").onclick = () => guard(doSearch, $("#sgo"));
  $("#sq").onkeydown = ev => { if (ev.key === "Enter") $("#sgo").click(); };
  $("#useOv").onclick = useOverview;
  if (isNew && !f.title) $("#sq").focus();
}
function setMode(kind, mode) { sel[kind].mode = mode; const r = document.querySelector(`input[name=m-${kind}][value=${mode}]`); if (r) r.checked = true;  if (kind === "hero") foDraw(); }
function wireImageInputs(kind) {
  document.querySelectorAll(`input[name=m-${kind}]`).forEach(r => r.onchange = () => { sel[kind].mode = r.value; if (kind === "hero") foDraw(); });
  $("#file-" + kind).onchange = () => {
    const file = $("#file-" + kind).files[0]; if (!file) return;
    const rd = new FileReader(); rd.onload = () => { sel[kind].upload = {name: file.name, data: rd.result}; setMode(kind, "upload"); $("#fprev-" + kind).innerHTML = `<img src="${rd.result}" alt="">`; }; rd.readAsDataURL(file);
  };
  const u = $("#url-" + kind);
  const showUrl = () => {
    const p = $("#uprev-" + kind), v = sel[kind].url;
    p.innerHTML = /^https?:\/\//.test(v) ? `<img src="${esc(v)}" alt="" onerror="this.parentNode.innerHTML='<span class=note>Podglądu nie widać (strona może go blokować), ale spróbuję pobrać przy zapisie.</span>'">` : "";
  };
  u.oninput = () => { sel[kind].url = u.value.trim(); if (sel[kind].url) setMode(kind, "url"); showUrl(); if (kind === "hero") foDraw(); };
  showUrl();
}
function drawImages() {
  const d = tmdbData;
  $("#bd").innerHTML = d ? d.backdrops.map(b => `<div class="img${tm.backdrop === b.path ? " on" : ""}" data-b="${esc(b.path)}"><img src="${T(b.path)}" alt="" loading="lazy"><small>${b.w}×${b.h}</small></div>`).join("") || '<p class="note">TMDB nie ma kadrów tego filmu — wgraj własny plik albo wklej link.</p>' : '<p class="note">Aby zobaczyć kadry z TMDB, najpierw znajdź film (krok 1).</p>';
  $("#ps").innerHTML = d ? d.posters.map(b => `<div class="img${tm.poster === b.path ? " on" : ""}" data-p="${esc(b.path)}"><img src="${T(b.path, "w185")}" alt="" loading="lazy"></div>`).join("") || '<p class="note">TMDB nie ma plakatów tego filmu.</p>' : '<p class="note">Aby zobaczyć plakaty z TMDB, najpierw znajdź film (krok 1).</p>';
  $("#bd").onclick = ev => { const x = ev.target.closest(".img"); if (!x) return; tm.backdrop = x.dataset.b; setMode("hero", "tmdb"); drawImages(); };
  $("#ps").onclick = ev => { const x = ev.target.closest(".img"); if (!x) return; tm.poster = x.dataset.p; setMode("poster", "tmdb"); drawImages(); };
}
async function doSearch() {
  const q = $("#sq").value.trim(); if (!q) return toast("Wpisz tytuł filmu.", "err");
  $("#candNote").textContent = "Szukam…";
  const d = await api(`/api/search?q=${encodeURIComponent(q)}&year=${encodeURIComponent($("#sy").value.trim())}&director=${encodeURIComponent($("#sd").value.trim())}`);
  $("#candNote").textContent = d.results.length ? "Kliknij właściwy film:" : "Nic nie znaleziono. Spróbuj innego tytułu (np. oryginalnego) albo bez roku.";
  $("#cands").innerHTML = d.results.map(c => `<div class="cand" data-id="${c.id}">${c.poster ? `<img src="${T(c.poster, "w185")}" alt="">` : ""}<b>${esc(c.title)}</b><small>${esc(c.year)} · ${esc(c.director || "?")}</small>${c.match ? '<div class="m">zgodny reżyser</div>' : ""}</div>`).join("");
  $("#cands").onclick = ev => { const c = ev.target.closest(".cand"); if (c) guard(() => pick(c.dataset.id, c)); };
}
async function pick(id, el) {
  document.querySelectorAll(".cand").forEach(x => x.classList.remove("on")); el.classList.add("on");
  const onlyImg = !isNew && $("#onlyImg") && $("#onlyImg").checked;
  tmdbData = await api("/api/movie?id=" + id);
  collect();
  if (!onlyImg) cur.film = {...tmdbData.film};
  tm = {poster: tmdbData.poster_default, backdrop: tmdbData.backdrop_default};
  if (isNew) { sel.hero.mode = "tmdb"; sel.poster.mode = "tmdb"; }
  render();
  $("#sq").value = tmdbData.film.title; $("#sd").value = tmdbData.film.director; $("#sy").value = tmdbData.film.year;
  $("#candNote").textContent = onlyImg ? "Zdjęcia z TMDB gotowe — kliknij wybrany kadr lub plakat poniżej." : "Dane filmu uzupełnione. Wybierz kadr i plakat poniżej (kliknij zdjęcie) albo użyj własnego pliku lub linku.";
  $("#bd").scrollIntoView({behavior: "smooth", block: "center"});
}
function useOverview() { if (tmdbData) document.querySelector('[data-k=description]').value = tmdbData.overview; }
function collect() {
  document.querySelectorAll("[data-k]").forEach(i => { const k = i.dataset.k; if (k.startsWith("f.")) { cur.film = cur.film || {}; cur.film[k.slice(2)] = i.value.trim(); } else cur[k] = i.value.trim(); });
}
const spec = (kind, path) => ({mode: sel[kind].mode, path, upload: sel[kind].upload, url: sel[kind].url});
$("#saveBtn").onclick = () => guard(async () => {
  collect();
  const ev = {...cur, number: Number(cur.number)};
  const r = await api("/api/save", {event: ev, isNew, hero: spec("hero", tm.backdrop), poster: spec("poster", tm.poster)});
  toast(`Zapisano „${r.summary.title}”. Podgląd: http://localhost:8123/wydarzenie.html?id=${r.id}\nAby pokazać zmianę na stronie w internecie, kliknij „Opublikuj na stronie”.`);
  await loadList(); await openEvent(r.id);
}, $("#saveBtn"));
$("#delBtn").onclick = () => guard(async () => {
  if (!cur || isNew) return;
  const title = (cur.film && cur.film.title) || "";
  if (!confirm(`Usunąć wydarzenie #${cur.number} „${title}” (${cur.date})?\n\nZniknie z listy na Twoim komputerze. Na stronie w internecie zniknie po kliknięciu „Opublikuj na stronie”. Do czasu publikacji można je przywrócić (git), po publikacji też, ale trudniej.`)) return;
  const r = await api("/api/delete", {id: cur.id});
  lastMsg = `Usunięto wydarzenie #${r.number}: ${r.title}`;
  cur = null; isNew = false; resetSel();
  $("#saveBar").classList.add("hide");
  $("#main").innerHTML = `<h2>Usunięto</h2><p class="note">Wydarzenie #${r.number} „${esc(r.title)}” zostało usunięte${r.removedFiles.length ? ` razem z ${r.removedFiles.length} zdjęciem/zdjęciami, których nie używało inne wydarzenie` : ""}. Aby zmiana pojawiła się na stronie w internecie, kliknij „Opublikuj na stronie”.</p>`;
  toast(lastMsg + ". Kliknij „Opublikuj na stronie”, żeby zmiana trafiła do internetu.");
  await loadList();
}, $("#delBtn"));
let lastMsg = "";
$("#pubBtn").onclick = () => guard(async () => {
  if (!confirm("Opublikować wszystkie zapisane zmiany na stronie w internecie?")) return;
  const r = await api("/api/publish", {message: cur && cur.film && cur.film.title ? `Wydarzenie #${cur.number}: ${cur.film.title}` : lastMsg || "Aktualizacja wydarzeń z panelu"});
  toast(r.text, r.ok ? "ok" : "err", 12000); await loadList();
}, $("#pubBtn"));
guard(loadList);
</script></body></html>
